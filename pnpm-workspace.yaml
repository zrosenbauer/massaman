packages:
  - packages/*
  - scripts

overrides:
  # unrun@0.2.38 was published without its declared dist files, which hangs tsdown.
  unrun: 0.2.39
  # Vite filesystem bypass and launch-editor command injection advisories (transitive via vitest).
  vite: ^8.3.0
  # GHSA-ggr8-5vv4-36mx — stack exhaustion merging recursive object graphs (transitive via eslint-plugin-functional).
  deepmerge-ts: ^8.0.0
  # Fast-uri SSRF, host confusion, and host case normalization advisories (transitive via ajv).
  fast-uri: ^3.1.8
  # GHSA-2883-xcg3-v3hh — maxTotalMergeKeys does not limit CPU for empty merge sources (transitive via gray-matter / cosmiconfig).
  js-yaml@^3.0.0: ^3.15.2
  js-yaml@^4.0.0: ^4.3.2
  # GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p — brace-expansion denial of service.
  brace-expansion@^5.0.0: ^5.0.12
  # GHSA-68fv-2mgg-jv7q — indexed source-map offset denial of service.
  source-map-js: ^1.2.2
  # GHSA-238p-pmpm-9mq7 — Mermaid's KaTeX version permits trust bypass after prototype pollution.
  katex: ^0.19.0

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Current catalog upgrades predate the policy and are still inside its seven-day window.
  - es-toolkit@1.51.0
  - ts-pattern@5.9.0
  # Existing release and commit tooling landed before strict lockfile verification was enabled.
  - '@changesets/format@0.1.2'
  - '@commitlint/cli@21.2.2'
  - '@commitlint/config-conventional@21.2.2'
  - '@commitlint/format@21.2.2'
  - '@commitlint/is-ignored@21.2.2'
  - '@commitlint/lint@21.2.2'
  - '@commitlint/load@21.2.2'
  - '@commitlint/parse@21.2.2'
  - '@commitlint/resolve-extends@21.2.2'
  - '@commitlint/rules@21.2.2'
  # Ciderpress 1.0.0-rc.16 and its pinned build stack are still inside the seven-day window.
  - '@ciderpress/cli@1.0.0-rc.16'
  - '@ciderpress/config@1.0.0-rc.13'
  - '@ciderpress/theme@1.0.0-rc.8'
  - '@ciderpress/ui@1.0.0-rc.16'
  - ciderpress@1.0.0-rc.16
  - '@rsbuild/core@2.1.13'
  - '@rspack/binding-darwin-arm64@2.1.10'
  - '@rspack/binding-darwin-x64@2.1.10'
  - '@rspack/binding-linux-arm64-gnu@2.1.10'
  - '@rspack/binding-linux-arm64-musl@2.1.10'
  - '@rspack/binding-linux-ppc64-gnu@2.1.10'
  - '@rspack/binding-linux-riscv64-gnu@2.1.10'
  - '@rspack/binding-linux-riscv64-musl@2.1.10'
  - '@rspack/binding-linux-s390x-gnu@2.1.10'
  - '@rspack/binding-linux-x64-gnu@2.1.10'
  - '@rspack/binding-linux-x64-musl@2.1.10'
  - '@rspack/binding-wasm32-wasi@2.1.10'
  - '@rspack/binding-win32-arm64-msvc@2.1.10'
  - '@rspack/binding-win32-ia32-msvc@2.1.10'
  - '@rspack/binding-win32-x64-msvc@2.1.10'
  - '@rspack/binding@2.1.10'
  - '@rspack/core@2.1.10'
trustPolicy: no-downgrade
trustPolicyExclude:
  # This existing lockfile version predates the registry's newer lower-integrity publication.
  - cytoscape@3.34.1

catalog:
  '@changesets/cli': ^3.0.3
  '@types/node': ^26.6.5
  '@vitest/coverage-v8': ^5.0.4
  cac: ^7.1.0
  es-toolkit: 1.52.0
  oxfmt: ^0.73.0
  oxlint: ^1.88.0
  ts-pattern: 5.9.2
  tsdown: 0.23.1
  tsx: ^4.23.15
  turbo: ^2.11.8
  typescript: ^7.0.2
  vitest: ^5.0.4
  zx: ^8.8.5

allowBuilds:
  esbuild: true
  lefthook: true
