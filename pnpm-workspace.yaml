packages:
  - packages/*
  - scripts

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@rspack/*'
  - '@turbo/*'
  - es-toolkit
  - ts-pattern
  - turbo
trustPolicy: no-downgrade

catalog:
  '@types/node': ^26.2.0
  '@vitest/coverage-v8': ^4.1.10
  es-toolkit: 1.51.0
  ts-pattern: 5.9.0
  tsdown: 0.22.14
  tsx: ^4.23.12
  typescript: ^7.0.2
  vitest: ^4.1.10

onlyBuiltDependencies:
  - esbuild
  - lefthook
