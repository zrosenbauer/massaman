name: Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - '.ciderpress/**'
      - 'ciderpress.config.ts'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/docs-base.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - '.ciderpress/**'
      - 'ciderpress.config.ts'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/docs-base.mjs'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
        env:
          CIDERPRESS_BASE: /

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .ciderpress/dist --project-name=massaman --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- massaman-docs-preview -->'
            const body = `${marker}\n## Docs preview\n\n[Open preview](${process.env.PREVIEW_URL})\n\nUpdated for ${context.sha.slice(0, 7)}.`
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            })
            const comment = comments.find(({ body }) => body?.includes(marker))

            if (comment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: comment.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }
